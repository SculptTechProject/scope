name: Build and check
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Check ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; explicit compiler below
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm test -- --run
      - run: node --test scripts/release.test.mjs
      - run: python -m unittest discover -s resources/device/tests
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Exercise real desktop engine and stdio MCP
        run: node scripts/smoke.mjs
        env:
          SCOPE_BIN: target/release/scope${{ runner.os == 'Windows' && '.exe' || '' }}
          SCOPE_MCP_BIN: target/release/scope-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify public resources
        run: node scripts/public-resources.mjs .runtime/public-resources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scope-check-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/
            target/release/scope-mcp*
          if-no-files-found: error
          retention-days: 14
