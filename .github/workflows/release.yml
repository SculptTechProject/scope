name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v0.1.0-alpha.1
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate release tag
        run: node -e "if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) process.exit(1)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: node --test scripts/release.test.mjs
      - run: python -m unittest discover -s resources/device/tests
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Stage release assets
        shell: bash
        run: node scripts/release-assets.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: .runtime/release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Refuse to modify an already published release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > existing-state.txt 2>/dev/null; then
            test "$(cat existing-state.txt)" = true || { echo 'Release is already public; review CI artifacts manually.'; exit 1; }
          else
            printf '%s\n' 'Alpha build. Frida runtime is installed separately with the shipped setup helper. macOS arm64 was manually tested; Windows/Linux assets require runtime review before publication. See repository docs/RELEASING.md and docs/DEPENDENCIES.md.' > release-notes.txt
            gh release create "$RELEASE_TAG" --draft --prerelease --title "Scope $RELEASE_TAG" --notes-file release-notes.txt
          fi
      - name: Combine checksums and upload draft assets
        shell: bash
        run: |
          cd release-assets
          cat *-SHA256SUMS.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./* --clobber
