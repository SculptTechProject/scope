[package]
name = "scope-device"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "io-std", "net", "sync", "macros", "rt-multi-thread"] }
pem = "4"
x509-parser = "0.18"
md-5 = "0.10"

[dev-dependencies]
tempfile = "3"
